services:
  - type: web
    name: vision-ai-casting-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://vision-web-eight.vercel.app
      - key: CORS_ORIGINS
        value: '["https://vision-web-eight.vercel.app","https://vision-ai-casting-70fgxtvon-jfmidon-commits-projects.vercel.app"]'
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: VISAGISM_SIMULATION_PROVIDER
        value: fal
      - key: VISAGISM_SIMULATION_MODEL
        value: fal-ai/flux-general/inpainting
      - key: VISAGISM_IDENTITY_PROVIDER
        value: aws_rekognition
      - key: FAL_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET
        value: vision-ai-casting-media
      - key: AWS_REKOGNITION_ENABLED
        value: "false"
      - key: VISION_BYPASS_TRIAGE
        value: "true"
