name: One-shot Black interpretation test

on:
  push:
    branches:
      - feature/visagism-real-hair-simulation-p1

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'chore: run exact Black for interpretation test'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact CI Black
        run: |
          python -m pip install --quiet black==26.5.1
          black backend/app/tests/test_visagism_interpretation_v1.py
      - name: Commit exact formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/tests/test_visagism_interpretation_v1.py
          git commit -m "style: format visagism interpretation test"
          git push origin HEAD:feature/visagism-real-hair-simulation-p1
