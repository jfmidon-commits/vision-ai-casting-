name: Visagism Visual Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visagism-live-smoke.yml"
      - "backend/scripts/visagism_visual_live_smoke.py"
      - "backend/app/ai/visagism/image_simulator.py"
      - "backend/app/config.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/visagism-live-smoke.yml"
      - ".github/live-smoke-trigger.txt"
      - "backend/scripts/visagism_visual_live_smoke.py"
      - "backend/app/ai/visagism/image_simulator.py"
      - "backend/app/config.py"

permissions:
  contents: read

jobs:
  live-image-edit:
    name: Live Cloudflare FLUX Image Edit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
      CLOUDFLARE_IMAGE_WIDTH: "1024"
      CLOUDFLARE_IMAGE_HEIGHT: "1024"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Cloudflare runtime configuration
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::LIVE_SMOKE_BLOCKED: CLOUDFLARE_API_TOKEN is not configured."
            exit 2
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::LIVE_SMOKE_BLOCKED: CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 2
          fi
          echo "Cloudflare credentials are present (token value intentionally hidden)."

      - name: Install smoke dependencies
        run: pip install "pydantic-settings==2.3.4" "httpx==0.27.0" "pillow==10.4.0"

      - name: Run one real Cloudflare FLUX visagism image edit
        working-directory: backend
        run: python scripts/visagism_visual_live_smoke.py

      - name: Upload generated visual simulation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visagism-cloudflare-flux-live-smoke
          path: backend/benchmark_results/live/visagism_visual_smoke.png
          if-no-files-found: error
          retention-days: 7
