name: Visagism Visual Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visagism-live-smoke.yml"
      - "backend/scripts/visagism_visual_live_smoke.py"
      - "backend/app/ai/visagism/image_simulator.py"
      - "backend/app/config.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/visagism-live-smoke.yml"
      - ".github/live-smoke-trigger.txt"
      - "backend/scripts/visagism_visual_live_smoke.py"
      - "backend/app/ai/visagism/image_simulator.py"
      - "backend/app/config.py"

permissions:
  contents: read

jobs:
  live-image-edit:
    name: Live OpenAI Image Edit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: gpt-image-2
      OPENAI_IMAGE_SIZE: 1024x1024
      OPENAI_IMAGE_QUALITY: low
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify runtime secret
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::LIVE_SMOKE_BLOCKED: OPENAI_API_KEY is not configured in repository or production environment secrets."
            exit 2
          fi
          echo "OPENAI_API_KEY is present (value intentionally hidden)."

      - name: Install smoke dependencies
        run: pip install "pydantic-settings==2.3.4" "httpx==0.27.0" "pillow==10.4.0" "numpy==2.1.3"

      - name: Run one real visagism image edit
        working-directory: backend
        run: python scripts/visagism_visual_live_smoke.py

      - name: Upload generated visual simulation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: visagism-visual-live-smoke
          path: backend/benchmark_results/live/visagism_visual_smoke.png
          if-no-files-found: error
          retention-days: 7
