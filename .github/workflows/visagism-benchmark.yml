# CI validation touch: 2026-08-19
name: Visagism Benchmark - Dataset 001

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Caminho do dataset'
        required: false
        default: 'backend/tests/fixtures/visagism/dataset_001'
        type: string

  schedule:
    - cron: '5 8 * * *'

  push:
    paths:
      - 'backend/app/ai/visagism/**'
      - 'backend/app/ai/image_triage/**'
      - 'backend/app/ai/mediapipe/**'
      - 'backend/tests/fixtures/visagism/**'
      - 'backend/tests/test_visagism_benchmark.py'
      - '.github/workflows/visagism-benchmark.yml'

  pull_request:
    paths:
      - 'backend/app/ai/visagism/**'
      - 'backend/app/ai/image_triage/**'
      - 'backend/app/ai/mediapipe/**'
      - 'backend/tests/fixtures/visagism/**'
      - 'backend/tests/test_visagism_benchmark.py'
      - '.github/workflows/visagism-benchmark.yml'

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"
  BENCHMARK_VERSION: "3-persisted-results"

jobs:
  benchmark:
    name: Visagism Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "import mediapipe; print(f'MediaPipe OK')"
          python -c "import cv2; print(f'OpenCV: {cv2.__version__}')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import numpy as np; print(f'NumPy: {np.__version__}')"

      - name: Check dataset
        id: check_dataset
        run: |
          DATASET_PATH="${{ github.event.inputs.dataset_path || 'backend/tests/fixtures/visagism/dataset_001' }}"
          echo "dataset_path=$DATASET_PATH" >> $GITHUB_OUTPUT
          if [ -d "$DATASET_PATH" ] && [ "$(ls -A $DATASET_PATH/*.jpg $DATASET_PATH/*.jpeg $DATASET_PATH/*.png 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "has_images=true" >> $GITHUB_OUTPUT
          else
            echo "has_images=false" >> $GITHUB_OUTPUT
          fi

      - name: Run benchmark tests
        id: benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock' }}
        run: |
          cd backend
          python -m pytest tests/test_visagism_benchmark.py -v --tb=short

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visagism-benchmark-dataset-001
          path: |
            backend/benchmark_output/
          retention-days: 7
          if-no-files-found: warn

      - name: Persist benchmark results to repository
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p backend/benchmark_results/latest
          cp backend/benchmark_output/benchmark_summary.json backend/benchmark_results/latest/benchmark_summary.json
          cp backend/benchmark_output/facemesh_result.json backend/benchmark_results/latest/facemesh_result.json
          cp backend/benchmark_output/visagism_result.json backend/benchmark_results/latest/visagism_result.json
          cat > backend/benchmark_results/latest/run_metadata.json <<EOF
          {
            "workflow": "Visagism Benchmark - Dataset 001",
            "benchmark_version": "$BENCHMARK_VERSION",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "event": "${{ github.event_name }}",
            "source_sha": "${{ github.sha }}",
            "dataset": "${{ steps.check_dataset.outputs.dataset_path }}"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/benchmark_results/latest
          if git diff --cached --quiet; then
            echo "Benchmark results unchanged; nothing to commit."
          else
            git commit -m "chore(visagism): persist latest benchmark results [skip ci]"
            git push origin HEAD:main
          fi

      - name: Report results
        if: always()
        run: |
          echo "=========================================="
          echo "  VISAGISM BENCHMARK COMPLETE"
          echo "=========================================="
          echo "Version: $BENCHMARK_VERSION"
          echo "Dataset: ${{ steps.check_dataset.outputs.dataset_path }}"
          echo "Images: ${{ steps.check_dataset.outputs.has_images }}"
          echo "Artifact: visagism-benchmark-dataset-001"
          echo "Persisted path: backend/benchmark_results/latest/"
          echo "=========================================="
