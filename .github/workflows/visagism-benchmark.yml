name: Visagism Benchmark - Dataset 001

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Caminho do dataset'
        required: false
        default: 'backend/tests/fixtures/visagism/dataset_001'
        type: string

  push:
    paths:
      - 'backend/app/ai/visagism/**'
      - 'backend/app/ai/image_triage/**'
      - 'backend/app/ai/mediapipe/**'
      - 'backend/tests/fixtures/visagism/**'
      - 'backend/tests/test_visagism_benchmark.py'
      - '.github/workflows/visagism-benchmark.yml'

env:
  PYTHON_VERSION: "3.11"

jobs:
  benchmark:
    name: Visagism Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "import mediapipe; print(f'MediaPipe OK')"
          python -c "import cv2; print(f'OpenCV: {cv2.__version__}')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import numpy as np; print(f'NumPy: {np.__version__}')"

      - name: Check dataset
        id: check_dataset
        run: |
          DATASET_PATH="${{ github.event.inputs.dataset_path || 'backend/tests/fixtures/visagism/dataset_001' }}"
          echo "dataset_path=$DATASET_PATH" >> $GITHUB_OUTPUT
          if [ -d "$DATASET_PATH" ] && [ "$(ls -A $DATASET_PATH/*.jpg $DATASET_PATH/*.jpeg $DATASET_PATH/*.png 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "has_images=true" >> $GITHUB_OUTPUT
          else
            echo "has_images=false" >> $GITHUB_OUTPUT
          fi

      - name: Run benchmark tests
        id: benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-mock' }}
        run: |
          cd backend
          python -m pytest tests/test_visagism_benchmark.py -v --tb=short

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visagism-benchmark-dataset-001
          path: |
            backend/benchmark_output/
          retention-days: 7
          if-no-files-found: warn

      - name: Report results
        if: always()
        run: |
          echo "=========================================="
          echo "  VISAGISM BENCHMARK COMPLETE"
          echo "=========================================="
          echo "Dataset: ${{ steps.check_dataset.outputs.dataset_path }}"
          echo "Images: ${{ steps.check_dataset.outputs.has_images }}"
          echo "Artifact: visagism-benchmark-dataset-001"
          echo "=========================================="
