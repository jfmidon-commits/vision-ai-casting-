name: Visagism Benchmark - Current Dataset

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Caminho do dataset'
        required: false
        default: 'assets/reference_photos/juliano_midon/visagismo_2026-08-21'
        type: string

  push:
    paths:
      - 'backend/app/pipelines/visagism/**'
      - 'backend/app/ai/visagism/**'
      - 'backend/app/ai/image_triage/**'
      - 'backend/app/ai/mediapipe/**'
      - 'assets/reference_photos/juliano_midon/visagismo_2026-08-21/**'
      - 'backend/tests/test_current_visagism_dataset_pipeline.py'
      - '.github/workflows/visagism-benchmark.yml'

env:
  PYTHON_VERSION: "3.11"

jobs:
  benchmark:
    name: Visagism Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev

      - name: Install Python dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "import mediapipe; print('MediaPipe OK')"
          python -c "import cv2; print(f'OpenCV: {cv2.__version__}')"
          python -c "from PIL import Image; print('Pillow OK')"
          python -c "import numpy as np; print(f'NumPy: {np.__version__}')"

      - name: Check current dataset
        id: check_dataset
        run: |
          DATASET_PATH="${{ github.event.inputs.dataset_path || 'assets/reference_photos/juliano_midon/visagismo_2026-08-21' }}"
          echo "dataset_path=$DATASET_PATH" >> "$GITHUB_OUTPUT"
          COUNT=$(find "$DATASET_PATH" -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)
          echo "image_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ ! -d "$DATASET_PATH" ] || [ "$COUNT" -lt 3 ]; then
            echo "Dataset insuficiente: $DATASET_PATH ($COUNT imagens)"
            exit 1
          fi

      - name: Run current-session visagism pipeline
        id: benchmark
        env:
          CURRENT_VISAGISM_DATASET: ${{ github.workspace }}/${{ steps.check_dataset.outputs.dataset_path }}
        run: |
          cd backend
          python -m pytest tests/test_current_visagism_dataset_pipeline.py -v --tb=short

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visagism-benchmark-2026-08-21
          path: |
            backend/benchmark_output/
          retention-days: 7
          if-no-files-found: warn

      - name: Report results
        if: always()
        run: |
          echo "=========================================="
          echo "  CURRENT VISAGISM PIPELINE COMPLETE"
          echo "=========================================="
          echo "Dataset: ${{ steps.check_dataset.outputs.dataset_path }}"
          echo "Images: ${{ steps.check_dataset.outputs.image_count }}"
          echo "Artifact: visagism-benchmark-2026-08-21"
          echo "=========================================="
