name: P1 Memory V3 Autofix

on:
  push:
    branches:
      - fix/p1-memory-v3
    paths:
      - '.github/workflows/p1-memory-v3-autofix.yml'

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-memory-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded sequential source loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/routers/analyses.py')
          text = path.read_text()

          old_constants = '''SIMULATION_DENOISING = 0.30\nSIMULATION_IDENTITY_WEIGHT = 0.90\n'''
          new_constants = '''SIMULATION_DENOISING = 0.30\nSIMULATION_IDENTITY_WEIGHT = 0.90\nSIMULATION_SOURCE_MAX_SIDE = 1024\n'''
          if old_constants not in text:
              raise SystemExit('constants anchor not found')
          text = text.replace(old_constants, new_constants, 1)

          old_reader = '''def _read_pil_storage_image(url: str) -> Image.Image:\n    raw = StorageService.read_object_from_url(url)\n    with Image.open(io.BytesIO(raw)) as image:\n        normalized = ImageOps.exif_transpose(image)\n        return normalized.convert("RGB").copy()\n'''
          new_reader = '''def _read_pil_storage_image(\n    url: str, max_side: int = SIMULATION_SOURCE_MAX_SIDE\n) -> Image.Image:\n    raw = StorageService.read_object_from_url(url)\n    with Image.open(io.BytesIO(raw)) as image:\n        normalized = ImageOps.exif_transpose(image)\n        normalized.thumbnail((max_side, max_side), Image.Resampling.LANCZOS)\n        if normalized.mode != "RGB":\n            normalized = normalized.convert("RGB")\n        return normalized.copy()\n'''
          if old_reader not in text:
              raise SystemExit('reader anchor not found')
          text = text.replace(old_reader, new_reader, 1)

          old_download = '''    # The normal mobile flow has three real photos total. The original source\n    # is also a legitimate identity reference, giving the required 3 refs.\n    selected_photos = [original] + [\n        photo for photo in photos if photo.id != original.id\n    ][:4]\n    downloaded = await asyncio.gather(\n        *[\n            asyncio.to_thread(_read_pil_storage_image, photo.url)\n            for photo in selected_photos\n        ],\n        return_exceptions=True,\n    )\n    original_image = (\n        downloaded[0]\n        if downloaded and not isinstance(downloaded[0], Exception)\n        else None\n    )\n'''
          new_download = '''    # Keep the production request below the Render free-instance memory ceiling:\n    # exactly three identity references, loaded one at a time and immediately\n    # bounded before the next source is decoded. Parallel decoding of 10-20 MP\n    # phone photos can otherwise create a large transient RGB/PIL memory spike.\n    selected_photos = [original] + [\n        photo for photo in photos if photo.id != original.id\n    ][:2]\n    downloaded = []\n    logger.info(\n        "Visagism simulation source load start analysis=%s haircut=%s refs=%s max_side=%s",\n        analysis_id,\n        request.haircut_name,\n        len(selected_photos),\n        SIMULATION_SOURCE_MAX_SIDE,\n    )\n    for index, photo in enumerate(selected_photos):\n        try:\n            image = await asyncio.to_thread(\n                _read_pil_storage_image, photo.url, SIMULATION_SOURCE_MAX_SIDE\n            )\n            downloaded.append(image)\n            logger.info(\n                "Visagism simulation source loaded analysis=%s index=%s size=%sx%s",\n                analysis_id,\n                index,\n                image.width,\n                image.height,\n            )\n        except Exception as exc:\n            downloaded.append(exc)\n            logger.warning(\n                "Visagism simulation source load failed analysis=%s index=%s error=%s",\n                analysis_id,\n                index,\n                type(exc).__name__,\n            )\n\n    original_image = (\n        downloaded[0]\n        if downloaded and not isinstance(downloaded[0], Exception)\n        else None\n    )\n'''
          if old_download not in text:
              raise SystemExit('download anchor not found')
          text = text.replace(old_download, new_download, 1)

          old_preflight = '''        preflight = await asyncio.to_thread(\n            service.preflight,\n            original_photo=original_image,\n            real_reference_photos=reference_images,\n        )\n'''
          new_preflight = '''        logger.info(\n            "Visagism simulation preflight start analysis=%s haircut=%s refs=%s",\n            analysis_id,\n            request.haircut_name,\n            len(reference_images),\n        )\n        preflight = await asyncio.to_thread(\n            service.preflight,\n            original_photo=original_image,\n            real_reference_photos=reference_images,\n        )\n        logger.info(\n            "Visagism simulation preflight done analysis=%s eligible=%s reason=%s",\n            analysis_id,\n            bool(preflight.get("eligible")),\n            preflight.get("reason"),\n        )\n'''
          if old_preflight not in text:
              raise SystemExit('preflight anchor not found')
          text = text.replace(old_preflight, new_preflight, 1)

          old_service = '''        service_result = await asyncio.to_thread(\n            service.simulate,\n            original_photo=original_image,\n            real_reference_photos=reference_images,\n            source_photos=source_images,\n            preferred_original=original_image,\n            edit_instruction=instruction,\n            denoising=SIMULATION_DENOISING,\n            identity_weight=SIMULATION_IDENTITY_WEIGHT,\n            preflight_result=preflight,\n        )\n'''
          new_service = '''        logger.info(\n            "Visagism simulation render start analysis=%s haircut=%s provider=%s",\n            analysis_id,\n            request.haircut_name,\n            runtime.provider,\n        )\n        service_result = await asyncio.to_thread(\n            service.simulate,\n            original_photo=original_image,\n            real_reference_photos=reference_images,\n            source_photos=source_images,\n            preferred_original=original_image,\n            edit_instruction=instruction,\n            denoising=SIMULATION_DENOISING,\n            identity_weight=SIMULATION_IDENTITY_WEIGHT,\n            preflight_result=preflight,\n        )\n        logger.info(\n            "Visagism simulation render done analysis=%s status=%s reason=%s",\n            analysis_id,\n            service_result.get("simulation_status"),\n            service_result.get("reason"),\n        )\n'''
          if old_service not in text:
              raise SystemExit('service anchor not found')
          text = text.replace(old_service, new_service, 1)

          path.write_text(text)
          PY

          python -m pip install --quiet black==26.5.1 isort
          black backend/app/routers/analyses.py
          isort backend/app/routers/analyses.py
          git rm .github/workflows/p1-memory-v3-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routers/analyses.py
          git commit -m "fix: bound P1 source image memory before simulation"
          git push origin HEAD:fix/p1-memory-v3
