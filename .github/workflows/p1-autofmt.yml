name: P1 One-shot Formatter

on:
  push:
    branches:
      - feature/visagism-real-hair-simulation-p1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatters
        run: pip install black==26.5.1 isort==8.0.1
      - name: Format changed backend Python files
        run: |
          FILES=$(git diff --name-only origin/main...HEAD | grep '^backend/app/.*\.py$' | paste -sd ' ' - || true)
          if [ -z "$FILES" ]; then
            echo "No changed backend Python files"
            exit 0
          fi
          black $FILES
          isort $FILES
          black $FILES
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app
          git commit -m "style: format P1 backend with black and isort"
          git push origin HEAD:feature/visagism-real-hair-simulation-p1
