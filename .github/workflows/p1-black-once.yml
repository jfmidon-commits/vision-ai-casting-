name: P1 Black once

on:
  push:
    branches:
      - feature/visagism-real-hair-simulation-p1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: pip install black==26.5.1
      - name: Format prompt builder
        run: |
          cd backend
          black app/ai/visagism/prompt_builder.py
      - name: Commit exact Black output if needed
        run: |
          if git diff --quiet; then
            echo "Already Black-formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/ai/visagism/prompt_builder.py
          git commit -m "style: apply exact Black format to P1 prompt"
          git push origin HEAD:feature/visagism-real-hair-simulation-p1
