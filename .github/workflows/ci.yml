name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  AWS_REGION: us-east-1

jobs:
  # ==================== BACKEND ====================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install black isort flake8 mypy pylint
      - name: Get changed Python files
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^backend/app/.*\.py$' | sed 's#^backend/##' | paste -sd ' ' - || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^backend/app/.*\.py$' | sed 's#^backend/##' | paste -sd ' ' - || true)
          fi
          if [ -z "$CHANGED" ]; then
            echo "No Python files changed. Skipping lint checks."
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "files=" >> $GITHUB_OUTPUT
          else
            echo "Changed backend Python files: $CHANGED"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          fi
      - name: Run black
        if: steps.changed-files.outputs.skip == 'false'
        run: cd backend && black --check ${{ steps.changed-files.outputs.files }}
      - name: Run isort
        if: steps.changed-files.outputs.skip == 'false'
        run: cd backend && isort --check-only ${{ steps.changed-files.outputs.files }}
      - name: Run flake8
        if: steps.changed-files.outputs.skip == 'false'
        run: cd backend && flake8 ${{ steps.changed-files.outputs.files }} --max-line-length=120
      - name: Run mypy
        if: steps.changed-files.outputs.skip == 'false'
        run: cd backend && mypy ${{ steps.changed-files.outputs.files }} --ignore-missing-imports

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vision_ai_casting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vision_ai_casting_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=html -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # ==================== FRONTEND ====================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check-frontend
        run: |
          if [ ! -f "frontend/package.json" ]; then
            echo "Frontend package.json not found. Skipping frontend jobs."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check-frontend.outputs.skip == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        if: steps.check-frontend.outputs.skip == 'false'
        run: |
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Run ESLint
        if: steps.check-frontend.outputs.skip == 'false'
        run: cd frontend && npm run lint
      - name: Run TypeScript check
        if: steps.check-frontend.outputs.skip == 'false'
        run: cd frontend && npm run type-check

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check-frontend
        run: |
          if [ ! -f "frontend/package.json" ]; then
            echo "Frontend package.json not found. Skipping frontend jobs."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check-frontend.outputs.skip == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        if: steps.check-frontend.outputs.skip == 'false'
        run: |
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Run tests
        if: steps.check-frontend.outputs.skip == 'false'
        run: cd frontend && npm test -- --coverage --watchAll=false --passWithNoTests
      - name: Upload coverage
        if: steps.check-frontend.outputs.skip == 'false'
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    if: always() && needs.frontend-lint.result == 'success' && needs.frontend-test.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          cd frontend
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build
        run: cd frontend && npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next

  # ==================== SECURITY ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"

  # ==================== DEPLOY PLACEHOLDERS ====================
  deploy-staging:
    name: Deploy to Staging (placeholder)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deployment not configured yet
        run: |
          echo "Staging deployment is not configured yet."
          echo "No cloud credentials are required until a real deployment target is wired."

  deploy-production:
    name: Deploy to Production (placeholder)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deployment not configured yet
        run: |
          echo "Production deployment is not configured yet."
          echo "No AWS or Slack credentials are required until a real deployment target is wired."
