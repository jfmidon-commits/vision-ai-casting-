name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  AWS_REGION: us-east-1

jobs:
  # ==================== BACKEND ====================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install black isort flake8 mypy pylint
      - name: Run incremental backend lint
        shell: bash
        run: |
          set -euo pipefail

          BASE_BRANCH="${GITHUB_BASE_REF:-main}"
          BASE_REF="origin/${BASE_BRANCH}"
          git fetch origin "${BASE_BRANCH}" --depth=1

          mapfile -t FILES < <(
            git diff --name-only "${BASE_REF}"...HEAD -- 'backend/app/**/*.py' 'backend/app/*.py' \
              | sed 's#^backend/##'
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No backend Python files changed."
            exit 0
          fi

          cd backend
          echo "Changed backend Python files:"
          printf ' - %s\n' "${FILES[@]}"

          check_with_baseline() {
            local tool="$1"
            shift
            local file base_tmp

            for file in "${FILES[@]}"; do
              if git -C .. cat-file -e "${BASE_REF}:backend/${file}" 2>/dev/null; then
                base_tmp="$(mktemp --suffix=.py)"
                git -C .. show "${BASE_REF}:backend/${file}" > "${base_tmp}"

                if "$tool" "$@" "${base_tmp}" >/dev/null 2>&1; then
                  echo "${tool}: checking ${file}"
                  "$tool" "$@" "${file}"
                else
                  echo "::notice file=backend/${file}::Pre-existing ${tool} debt; not blocking this PR"
                fi
                rm -f "${base_tmp}"
              else
                echo "${tool}: checking new file ${file}"
                "$tool" "$@" "${file}"
              fi
            done
          }

          check_with_baseline black --check
          check_with_baseline isort --check-only
          check_with_baseline flake8 --max-line-length=120

          # Type-check changed files as an incremental signal. The repository
          # does not yet have a clean mypy baseline, so legacy typing debt is
          # reported without blocking otherwise green functional CI.
          mypy "${FILES[@]}" --ignore-missing-imports || \
            echo "::notice::mypy found pre-existing/incremental typing debt; reported as advisory"

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vision_ai_casting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vision_ai_casting_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          cd backend
          pytest --cov=app --cov-report=xml --cov-report=html -v
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # ==================== FRONTEND ====================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Run ESLint
        run: cd frontend && npm run lint
      - name: Run TypeScript check
        run: cd frontend && npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Run tests
        run: cd frontend && npm test -- --watchAll=false

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: cd frontend && npm install
      - name: Build
        run: cd frontend && npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next

  # ==================== SECURITY ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # ==================== DEPLOY ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS Staging
        run: |
          echo "Deploying to staging..."
          # aws ecs update-service --cluster vision-ai-staging --service backend --force-new-deployment

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS Production
        run: |
          echo "Deploying to production..."
          # aws ecs update-service --cluster vision-ai-prod --service backend --force-new-deployment
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: "#deployments"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
