name: P1 Hardening Once

on:
  push:
    branches: [feature/visagism-real-hair-simulation-p1]
    paths: [.github/workflows/p1-hardening-once.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python .github/scripts/p1_hardening.py
      - name: Format changed Python
        run: |
          pip install black==26.5.1 isort==8.0.1
          cd backend
          black app/ai/visagism/simulation_cache.py app/ai/visagism/simulation_budget.py app/ai/visagism/masked_overlay_pipeline.py app/ai/visagism/simulation_service.py app/ai/visagism/prompt_builder.py app/ai/visagism/barber_brief.py app/ai/visagism/runtime.py app/ai/visagism/adapters/mediapipe_hair_mask.py app/routers/analyses.py tests/test_simulation_cache.py tests/test_simulation_budget.py tests/test_preflight_mask_reuse.py
          isort app/ai/visagism/simulation_cache.py app/ai/visagism/simulation_budget.py app/ai/visagism/masked_overlay_pipeline.py app/ai/visagism/simulation_service.py app/ai/visagism/prompt_builder.py app/ai/visagism/barber_brief.py app/ai/visagism/runtime.py app/ai/visagism/adapters/mediapipe_hair_mask.py app/routers/analyses.py tests/test_simulation_cache.py tests/test_simulation_budget.py tests/test_preflight_mask_reuse.py
      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/ci.yml
          git rm .github/scripts/p1_hardening.py
          git add -A
          git commit -m "fix: harden P1 simulation cost cache and recovery"
          git push origin HEAD:feature/visagism-real-hair-simulation-p1
