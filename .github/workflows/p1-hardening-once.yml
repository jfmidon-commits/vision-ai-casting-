name: P1 Hardening Once

on:
  push:
    branches: [feature/visagism-real-hair-simulation-p1]
    paths: [.github/workflows/p1-hardening-once.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply hardening patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("backend/app/ai/visagism/simulation_cache.py").write_text('''"""Small JSONB metadata cache for approved visagism simulations.

Generated image bytes live in S3. Analysis.visagism stores only stable metadata
and object keys, so no migration or large base64 payload is required.
"""

from __future__ import annotations

import hashlib
from datetime import datetime, timezone
from typing import Any, Dict, Iterable, Optional

CACHE_FIELD = "simulation_cache_v1"
PIPELINE_VERSION = "hair-p1-v2"


def prompt_fingerprint(
    edit_instruction: str,
    *,
    denoising: float,
    identity_weight: float,
) -> str:
    raw = (
        edit_instruction.strip()
        + f"|denoising={float(denoising):.4f}"
        + f"|identity_weight={float(identity_weight):.4f}"
    )
    return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:20]


def cache_key(
    *,
    haircut_name: str,
    source_photo_id: str,
    provider: str,
    model: str,
    prompt_hash: str,
) -> str:
    raw = "|".join(
        (
            PIPELINE_VERSION,
            haircut_name.strip(),
            source_photo_id,
            provider.strip(),
            model.strip(),
            prompt_hash.strip(),
        )
    )
    return hashlib.sha256(raw.encode("utf-8")).hexdigest()[:24]


def object_key(*, tenant_id: str, analysis_id: str, key: str) -> str:
    return f"visagism-simulations/{tenant_id}/{analysis_id}/{key}.png"


def entries(visagism: Dict[str, Any]) -> Dict[str, Dict[str, Any]]:
    if not isinstance(visagism, dict):
        return {}
    raw = visagism.get(CACHE_FIELD)
    if not isinstance(raw, dict):
        return {}
    return {str(k): dict(v) for k, v in raw.items() if isinstance(v, dict)}


def find_ready(
    visagism: Dict[str, Any],
    *,
    haircut_name: str,
    source_photo_id: str,
    provider: Optional[str] = None,
    model: Optional[str] = None,
    prompt_hash: Optional[str] = None,
) -> Optional[Dict[str, Any]]:
    matches = []
    for item in entries(visagism).values():
        if item.get("status") != "ready":
            continue
        if item.get("pipeline_version") != PIPELINE_VERSION:
            continue
        if item.get("haircut_name") != haircut_name:
            continue
        if item.get("source_photo_id") != source_photo_id:
            continue
        if provider is not None and item.get("provider") != provider:
            continue
        if model is not None and item.get("model") != model:
            continue
        if prompt_hash is not None and item.get("prompt_hash") != prompt_hash:
            continue
        if not item.get("object_key"):
            continue
        matches.append(item)
    if not matches:
        return None
    return sorted(
        matches,
        key=lambda item: str(item.get("created_at") or ""),
        reverse=True,
    )[0]


def ready_for_source(
    visagism: Dict[str, Any], *, source_photo_id: str
) -> Iterable[Dict[str, Any]]:
    items = [
        item
        for item in entries(visagism).values()
        if item.get("status") == "ready"
        and item.get("pipeline_version") == PIPELINE_VERSION
        and item.get("source_photo_id") == source_photo_id
        and item.get("object_key")
    ]
    return sorted(
        items,
        key=lambda item: str(item.get("created_at") or ""),
        reverse=True,
    )


def with_ready_entry(
    visagism: Dict[str, Any],
    *,
    key: str,
    haircut_name: str,
    source_photo_id: str,
    provider: str,
    model: str,
    prompt_hash: str,
    denoising: float,
    identity_weight: float,
    stored_object_key: str,
    identity_score_min: float,
    mask_kind: Optional[str] = None,
) -> Dict[str, Any]:
    updated = dict(visagism) if isinstance(visagism, dict) else {}
    cache = entries(updated)
    cache[key] = {
        "status": "ready",
        "pipeline_version": PIPELINE_VERSION,
        "haircut_name": haircut_name,
        "source_photo_id": source_photo_id,
        "provider": provider,
        "model": model,
        "prompt_hash": prompt_hash,
        "denoising": float(denoising),
        "identity_weight": float(identity_weight),
        "object_key": stored_object_key,
        "identity_score_min": float(identity_score_min),
        "mask_kind": mask_kind,
        "created_at": datetime.now(timezone.utc).isoformat(),
    }
    updated[CACHE_FIELD] = cache
    return updated
''')

          Path("backend/app/ai/visagism/simulation_budget.py").write_text('''"""Persistent per-analysis budget guard for paid visual simulations."""

from __future__ import annotations

from dataclasses import dataclass
from datetime import datetime, timedelta, timezone
from typing import Any, Iterable, List, Optional

from sqlalchemy import and_, select

from app.database import AsyncSessionLocal
from app.models import Analysis

BUDGET_FIELD = "simulation_budget_v1"


@dataclass(frozen=True)
class SimulationBudgetDecision:
    allowed: bool
    remaining: int
    retry_after_seconds: int = 0
    reason: Optional[str] = None


def _parse_timestamp(value: Any) -> Optional[datetime]:
    if not isinstance(value, str):
        return None
    try:
        parsed = datetime.fromisoformat(value)
    except ValueError:
        return None
    if parsed.tzinfo is None:
        parsed = parsed.replace(tzinfo=timezone.utc)
    return parsed.astimezone(timezone.utc)


def recent_attempts(
    values: Iterable[Any], *, now: datetime, window_seconds: int
) -> List[datetime]:
    cutoff = now - timedelta(seconds=max(1, int(window_seconds)))
    parsed = [_parse_timestamp(value) for value in values]
    return sorted(item for item in parsed if item is not None and item >= cutoff)


def evaluate_budget(
    values: Iterable[Any],
    *,
    now: datetime,
    max_attempts: int,
    window_seconds: int,
) -> SimulationBudgetDecision:
    maximum = max(1, int(max_attempts))
    recent = recent_attempts(values, now=now, window_seconds=window_seconds)
    if len(recent) < maximum:
        return SimulationBudgetDecision(
            allowed=True,
            remaining=max(0, maximum - len(recent) - 1),
        )
    oldest = recent[0]
    retry_at = oldest + timedelta(seconds=max(1, int(window_seconds)))
    retry_after = max(1, int((retry_at - now).total_seconds()))
    return SimulationBudgetDecision(
        allowed=False,
        remaining=0,
        retry_after_seconds=retry_after,
        reason="simulation_budget_exhausted",
    )


async def claim_simulation_budget(
    *,
    analysis_id: Any,
    tenant_id: Any,
    max_attempts: int,
    window_seconds: int,
) -> SimulationBudgetDecision:
    now = datetime.now(timezone.utc)
    async with AsyncSessionLocal() as session:
        result = await session.execute(
            select(Analysis)
            .where(
                and_(Analysis.id == analysis_id, Analysis.tenant_id == tenant_id)
            )
            .with_for_update()
        )
        analysis = result.scalar_one_or_none()
        if analysis is None:
            return SimulationBudgetDecision(
                allowed=False,
                remaining=0,
                reason="analysis_not_found",
            )

        visagism = dict(analysis.visagism) if isinstance(analysis.visagism, dict) else {}
        raw_budget = visagism.get(BUDGET_FIELD)
        budget = raw_budget if isinstance(raw_budget, dict) else {}
        raw_attempts = budget.get("attempts")
        attempts = raw_attempts if isinstance(raw_attempts, list) else []
        decision = evaluate_budget(
            attempts,
            now=now,
            max_attempts=max_attempts,
            window_seconds=window_seconds,
        )
        if not decision.allowed:
            await session.rollback()
            return decision

        recent = recent_attempts(
            attempts,
            now=now,
            window_seconds=window_seconds,
        )
        recent.append(now)
        visagism[BUDGET_FIELD] = {
            "attempts": [item.isoformat() for item in recent],
            "max_attempts": max(1, int(max_attempts)),
            "window_seconds": max(1, int(window_seconds)),
            "last_attempt_at": now.isoformat(),
        }
        analysis.visagism = visagism
        await session.commit()
        return decision
''')

          Path("backend/app/ai/visagism/masked_overlay_pipeline.py").write_text('''"""Identity-safe haircut overlay orchestration for visagism.

The pipeline never regenerates the person. It edits only a validated hair mask,
verifies identity against real source photos, and fails closed to the original.
"""

from dataclasses import dataclass
from typing import Any, Dict, List, Optional, Protocol

from .identity_lock import DEFAULT_IDENTITY_LOCK, IdentityLockPolicy


class MaskAdapter(Protocol):
    def build_hair_mask(self, original_photo: Any) -> Dict[str, Any]: ...


class OverlayRenderer(Protocol):
    def render(
        self,
        *,
        init_image: Any,
        reference_image: Any,
        mask: Any,
        edit_instruction: str,
        denoising: float,
        identity_weight: float,
    ) -> Any: ...


class IdentityVerifier(Protocol):
    def compare(self, candidate: Any, reference: Any) -> float: ...


@dataclass
class MaskedOverlayPipeline:
    mask_adapter: MaskAdapter
    renderer: OverlayRenderer
    verifier: IdentityVerifier
    policy: IdentityLockPolicy = DEFAULT_IDENTITY_LOCK

    def run(
        self,
        *,
        original_photo: Any,
        real_reference_photos: List[Any],
        edit_instruction: str,
        denoising: float = 0.30,
        identity_weight: float = 0.90,
        validated_mask_result: Optional[Dict[str, Any]] = None,
    ) -> Dict[str, Any]:
        if (
            not self.policy.min_reference_validations
            <= len(real_reference_photos)
            <= self.policy.max_reference_validations
        ):
            return self._fallback(original_photo, "invalid_reference_count")
        if not self.policy.min_denoising <= denoising <= self.policy.max_denoising:
            return self._fallback(original_photo, "unsafe_denoising")
        if identity_weight < self.policy.min_identity_weight:
            return self._fallback(original_photo, "identity_weight_too_low")

        mask_result = (
            dict(validated_mask_result)
            if isinstance(validated_mask_result, dict)
            else self.mask_adapter.build_hair_mask(original_photo)
        )
        if not mask_result.get("valid"):
            return self._fallback(
                original_photo, mask_result.get("reason") or "hair_mask_failed"
            )
        if mask_result.get("protected_regions_touched"):
            return self._fallback(original_photo, "protected_region_in_mask")
        if mask_result.get("beard_enabled") is True:
            return self._fallback(original_photo, "beard_region_not_allowed")
        if mask_result.get("background_locked") is not True:
            return self._fallback(original_photo, "background_lock_not_confirmed")

        candidate = self.renderer.render(
            init_image=original_photo,
            reference_image=original_photo,
            mask=mask_result["mask"],
            edit_instruction=edit_instruction,
            denoising=denoising,
            identity_weight=identity_weight,
        )

        scores = [
            self.verifier.compare(candidate, ref) for ref in real_reference_photos
        ]
        if any(score < self.policy.identity_threshold for score in scores):
            return self._fallback(
                original_photo,
                "identity_lock_failed",
                identity_scores=scores,
            )

        return {
            "image": candidate,
            "mode": "hair_overlay",
            "simulationApplied": True,
            "identityVerified": True,
            "identityScores": scores,
            "baseImagePreserved": True,
            "editableRegions": ["hair"],
            "mask": {
                "kind": mask_result.get("mask_kind"),
                "coverage_ratio": mask_result.get("coverage_ratio"),
                "background_locked": True,
                "beard_enabled": False,
            },
        }

    @staticmethod
    def _fallback(original_photo: Any, reason: str, **extra: Any) -> Dict[str, Any]:
        return {
            "image": original_photo,
            "mode": "original_plus_spec",
            "simulationApplied": False,
            "reason": reason,
            "baseImagePreserved": True,
            **extra,
        }
''')

          Path("backend/app/ai/visagism/simulation_service.py").write_text('''"""Fail-closed orchestration for identity-safe haircut simulation."""

from __future__ import annotations

from dataclasses import dataclass
from typing import Any, Dict, Iterable, List, Mapping, Optional

from .card_photo_guard import DEFAULT_CARD_PHOTO_GUARD, CardPhotoGuard
from .identity_lock import DEFAULT_IDENTITY_LOCK, IdentityLockPolicy
from .masked_overlay_pipeline import (
    IdentityVerifier,
    MaskAdapter,
    MaskedOverlayPipeline,
    OverlayRenderer,
)
from .pixel_locked_renderer import PixelLockedRenderer


@dataclass
class VisagismSimulationService:
    mask_adapter: MaskAdapter
    verifier: IdentityVerifier
    renderer: Optional[OverlayRenderer] = None
    policy: IdentityLockPolicy = DEFAULT_IDENTITY_LOCK
    card_guard: CardPhotoGuard = DEFAULT_CARD_PHOTO_GUARD

    def preflight(
        self,
        *,
        original_photo: Any,
        real_reference_photos: List[Any],
    ) -> Dict[str, Any]:
        if (
            not self.policy.min_reference_validations
            <= len(real_reference_photos)
            <= self.policy.max_reference_validations
        ):
            return {
                "eligible": False,
                "reason": "invalid_reference_count",
                "mask": None,
                "reference_identity_scores": [],
            }

        mask_result = self.mask_adapter.build_hair_mask(original_photo)
        if not mask_result.get("valid"):
            return {
                "eligible": False,
                "reason": mask_result.get("reason") or "hair_mask_failed",
                "mask": mask_result,
                "reference_identity_scores": [],
            }
        if mask_result.get("protected_regions_touched"):
            return {
                "eligible": False,
                "reason": "protected_region_in_mask",
                "mask": mask_result,
                "reference_identity_scores": [],
            }
        if mask_result.get("beard_enabled") is True:
            return {
                "eligible": False,
                "reason": "beard_region_not_allowed",
                "mask": mask_result,
                "reference_identity_scores": [],
            }
        if mask_result.get("background_locked") is not True:
            return {
                "eligible": False,
                "reason": "background_lock_not_confirmed",
                "mask": mask_result,
                "reference_identity_scores": [],
            }

        scores = [
            1.0 if ref is original_photo else self.verifier.compare(original_photo, ref)
            for ref in real_reference_photos
        ]
        if any(score < self.policy.identity_threshold for score in scores):
            return {
                "eligible": False,
                "reason": "reference_identity_gate_failed",
                "mask": mask_result,
                "reference_identity_scores": scores,
            }

        return {
            "eligible": True,
            "reason": None,
            "mask": mask_result,
            "reference_identity_scores": scores,
        }

    def simulate(
        self,
        *,
        original_photo: Any,
        real_reference_photos: List[Any],
        source_photos: Iterable[Mapping[str, Any]],
        edit_instruction: str,
        preferred_original: Optional[Any] = None,
        denoising: float = 0.30,
        identity_weight: float = 0.90,
        preflight_result: Optional[Dict[str, Any]] = None,
    ) -> Dict[str, Any]:
        if self.renderer is None:
            return self._blocked(
                source_photos=source_photos,
                preferred_original=preferred_original,
                reason="inpaint_provider_not_configured",
            )

        preflight = (
            dict(preflight_result)
            if isinstance(preflight_result, dict)
            else self.preflight(
                original_photo=original_photo,
                real_reference_photos=real_reference_photos,
            )
        )
        if not preflight.get("eligible"):
            return self._blocked(
                source_photos=source_photos,
                preferred_original=preferred_original,
                reason=str(preflight.get("reason") or "simulation_blocked"),
                diagnostics={"preflight": preflight},
            )

        pixel_locked = PixelLockedRenderer(delegate=self.renderer)
        pipeline = MaskedOverlayPipeline(
            mask_adapter=self.mask_adapter,
            renderer=pixel_locked,
            verifier=self.verifier,
            policy=self.policy,
        )
        try:
            result = pipeline.run(
                original_photo=original_photo,
                real_reference_photos=real_reference_photos,
                edit_instruction=edit_instruction,
                denoising=denoising,
                identity_weight=identity_weight,
                validated_mask_result=(
                    preflight.get("mask")
                    if isinstance(preflight.get("mask"), dict)
                    else None
                ),
            )
        except Exception as exc:
            reason = getattr(exc, "reason_code", "simulation_pipeline_error")
            return self._blocked(
                source_photos=source_photos,
                preferred_original=preferred_original,
                reason=reason,
                diagnostics={
                    "preflight": preflight,
                    "error_type": type(exc).__name__,
                },
            )

        if not result.get("simulationApplied"):
            return self._blocked(
                source_photos=source_photos,
                preferred_original=preferred_original,
                reason=result.get("reason") or "simulation_blocked",
                diagnostics={"preflight": preflight, "pipeline": result},
            )

        publication = self.policy.decide_publication(
            original_photo=original_photo,
            simulated_photo=result.get("image"),
            identity_scores=result.get("identityScores"),
            mask_valid=True,
            protected_regions_unchanged=True,
            body_unchanged=True,
        )
        card_media = self.card_guard.build_card_media(
            photos=source_photos,
            publication=publication,
            preferred_original=preferred_original,
        )

        if not card_media.get("simulationApplied"):
            return {
                "simulation_status": "blocked",
                "reason": card_media.get("reason") or "card_photo_guard_blocked",
                "card_media": card_media,
                "diagnostics": {"preflight": preflight},
            }

        return {
            "simulation_status": "ready",
            "reason": None,
            "card_media": card_media,
            "identity_scores": result.get("identityScores", []),
            "mask": result.get("mask") or {},
            "diagnostics": {"preflight": preflight},
        }

    def not_requested(
        self,
        *,
        source_photos: Iterable[Mapping[str, Any]],
        preferred_original: Optional[Any] = None,
    ) -> Dict[str, Any]:
        card_media = self.card_guard.build_card_media(
            photos=source_photos,
            preferred_original=preferred_original,
        )
        return {
            "simulation_status": "not_requested",
            "reason": None,
            "card_media": card_media,
        }

    def _blocked(
        self,
        *,
        source_photos: Iterable[Mapping[str, Any]],
        preferred_original: Optional[Any],
        reason: str,
        diagnostics: Optional[Dict[str, Any]] = None,
    ) -> Dict[str, Any]:
        original = self.card_guard.select_person_photo(
            source_photos, preferred_original
        )
        publication = {
            "image": original,
            "mode": "original_plus_spec",
            "simulationApplied": False,
            "identityVerified": False,
            "simulationBlocked": True,
            "reason": reason,
            "layers": {"base": original, "overlay": None},
        }
        card_media = self.card_guard.build_card_media(
            photos=source_photos,
            publication=publication,
            preferred_original=preferred_original,
        )
        return {
            "simulation_status": "blocked",
            "reason": reason,
            "card_media": card_media,
            "diagnostics": diagnostics or {},
        }
''')

          Path("backend/app/ai/visagism/prompt_builder.py").write_text('''"""Grounded prompt builder for haircut-only image editing."""

from __future__ import annotations

from typing import Any, Dict, List, Optional


def _clean(value: Any) -> Optional[str]:
    if not isinstance(value, str):
        return None
    text = value.strip()
    if not text or text.lower() in {"none", "null", "não medido", "nao medido"}:
        return None
    return text


def build_haircut_edit_instruction(haircut_name: str, visagism: Dict[str, Any]) -> str:
    source: Dict[str, Any] = visagism if isinstance(visagism, dict) else {}
    measured_value = source.get("measured_data_used")
    current_hair_value = source.get("current_hair")
    measured: Dict[str, Any] = (
        dict(measured_value) if isinstance(measured_value, dict) else {}
    )
    current_hair: Dict[str, Any] = (
        dict(current_hair_value) if isinstance(current_hair_value, dict) else {}
    )

    grounded_details: List[str] = []
    density = _clean(measured.get("hair_density")) or _clean(
        current_hair.get("density")
    )
    texture = _clean(measured.get("hair_texture")) or _clean(
        current_hair.get("texture")
    )
    hair_color = _clean(measured.get("hair_color")) or _clean(
        current_hair.get("color")
    )

    if density:
        grounded_details.append(f"visible measured hair density: {density}")
    if texture:
        grounded_details.append(f"visible measured hair texture: {texture}")
    if hair_color:
        grounded_details.append(f"confirmed current hair color: {hair_color}")

    details = (
        " Use only these confirmed hair observations: "
        + "; ".join(grounded_details)
        + "."
        if grounded_details
        else (
            " Do not invent hair density, texture, color, hairline, or length "
            "that cannot be inferred from the source image."
        )
    )

    return (
        "Edit only the hair inside the supplied hair mask. "
        "Keep every unmasked pixel unchanged. Preserve the exact person's "
        "identity and face geometry, expression, eyes, eyebrows, nose, mouth, "
        "teeth, ears, skin, beard, neck, body, clothing, and background. "
        f"Create a photorealistic haircut preview for: {haircut_name}. "
        "Respect the visible natural hairline, natural age cues, current hair "
        "tone, and the source photo. Never infer hair color from beard or "
        "eyebrows unless hair color was explicitly measured. Do not beautify, "
        "de-age, age, reshape, recolor skin, or modify the beard. The result is "
        "a haircut preview, not a new portrait." + details
    )
''')

          Path("backend/app/ai/visagism/barber_brief.py").write_text('''"""Grounded barber brief for any persisted recommended haircut."""

from __future__ import annotations

from typing import Any, Dict, List, Optional

from .interpretation import _barber_guidance, _clean_text, _face_shape_label


def build_barber_brief_for_haircut(
    analysis: Dict[str, Any], haircut_name: str
) -> Optional[Dict[str, Any]]:
    source: Dict[str, Any] = analysis if isinstance(analysis, dict) else {}
    hairstyles = [
        item.strip()
        for item in source.get("recommended_hairstyles", [])
        if isinstance(item, str) and item.strip()
    ]
    if haircut_name not in hairstyles:
        return None

    measured_value = source.get("measured_data_used")
    current_hair_value = source.get("current_hair")
    measured: Dict[str, Any] = (
        dict(measured_value) if isinstance(measured_value, dict) else {}
    )
    current_hair: Dict[str, Any] = (
        dict(current_hair_value) if isinstance(current_hair_value, dict) else {}
    )
    guidance = _barber_guidance(haircut_name, current_hair)

    grounded_in: List[str] = []
    face_shape = _face_shape_label(
        _clean_text(measured.get("face_shape"))
        or _clean_text(source.get("face_shape_category"))
    )
    density = _clean_text(measured.get("hair_density")) or _clean_text(
        current_hair.get("density")
    )
    hairline = _clean_text(measured.get("hairline")) or _clean_text(
        current_hair.get("hairline")
    )
    if face_shape:
        grounded_in.append(f"formato facial: {face_shape}")
    if density:
        grounded_in.append(f"densidade do cabelo: {density}")
    if hairline:
        grounded_in.append(f"linha frontal: {hairline}")

