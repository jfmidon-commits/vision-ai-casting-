name: One-shot Black fallback fix

on:
  push:
    branches:
      - feature/visagism-real-hair-simulation-p1

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'chore: run exact Black for fallback fix'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format exact CI version
        run: |
          python -m pip install --quiet black==26.5.1
          black backend/app/ai/visagism/analyzer.py backend/app/ai/visagism/fallback_ranker.py backend/app/ai/visagism/interpretation.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/ai/visagism/analyzer.py backend/app/ai/visagism/fallback_ranker.py backend/app/ai/visagism/interpretation.py
          git commit -m "style: align fallback fix with Black"
          git push origin HEAD:feature/visagism-real-hair-simulation-p1
