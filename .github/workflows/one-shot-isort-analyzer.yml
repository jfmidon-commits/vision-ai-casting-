name: One-shot isort analyzer

on:
  push:
    branches:
      - feature/visagism-real-hair-simulation-p1

permissions:
  contents: write

jobs:
  format:
    if: "github.event.head_commit.message == 'chore: run exact isort for analyzer'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Format analyzer imports
        run: |
          pip install isort==8.0.1
          cd backend
          isort app/ai/visagism/analyzer.py
          cd ..
          if git diff --quiet; then
            echo "No isort changes needed"
            exit 0
          fi
          git config user.name "Juliano Midon"
          git config user.email "jfmidon@gmail.com"
          git add backend/app/ai/visagism/analyzer.py
          git commit -m "style: sort visagism analyzer imports"
          git push origin HEAD:feature/visagism-real-hair-simulation-p1
