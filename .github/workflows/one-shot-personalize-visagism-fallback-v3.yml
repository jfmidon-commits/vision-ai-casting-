name: One-shot personalize visagism fallback v3

on:
  push:
    branches:
      - feature/visagism-real-hair-simulation-p1

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'chore: run personalized fallback patch v3'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/visagism-real-hair-simulation-p1
          fetch-depth: 0

      - name: Apply patch with Python indentation repair
        run: |
          set -euo pipefail
          python tools/one_shot_personalize_fallback.py
          python - <<'PY'
          from pathlib import Path

          analyzer_path = Path("backend/app/ai/visagism/analyzer.py")
          text = analyzer_path.read_text()
          marker = "\ndef _fallback_response("
          if marker not in text:
              raise SystemExit("top-level fallback marker not found")
          before, after = text.split(marker, 1)
          block = "def _fallback_response(" + after
          indented = "\n".join(("    " + line) if line else line for line in block.splitlines())
          analyzer_path.write_text(before + "\n" + indented + "\n")

          interpretation_path = Path("backend/app/ai/visagism/interpretation.py")
          text = interpretation_path.read_text()
          bad = '''if primary and rule_based:
              status = "partial_grounded"
          elif primary:
              status = "ready"
          elif data_source.get("llm_interpretation") is False and data_source.get("measured") is True:
              status = "service_limited"
          else:
              status = "insufficient_grounded_data"
          '''
          if bad not in text:
              raise SystemExit("unindented interpretation status block not found")
          good = "\n".join(("    " + line) if line else line for line in bad.splitlines()) + "\n"
          interpretation_path.write_text(text.replace(bad, good, 1))
          PY

          python -m pip install --quiet black==25.1.0
          black \
            backend/app/ai/visagism/analyzer.py \
            backend/app/ai/visagism/fallback_ranker.py \
            backend/app/ai/visagism/interpretation.py \
            backend/app/tests/test_visagism_resilient_fallback.py
          python -m compileall -q backend/app/ai/visagism

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/ai/visagism/analyzer.py \
            backend/app/ai/visagism/fallback_ranker.py \
            backend/app/ai/visagism/interpretation.py \
            backend/app/tests/test_visagism_resilient_fallback.py \
            frontend/types/index.ts \
            frontend/components/visagism/visagism-result.tsx
          git commit -m "fix: prevent cloned visagism fallback results"
          git push origin HEAD:feature/visagism-real-hair-simulation-p1
